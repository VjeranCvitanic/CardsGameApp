name: Cross-Platform Build

on:
  push:

  pull_request:

  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows
      BUILD_DIR: build-windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:GITHUB_WORKSPACE\vcpkg"
          & "$env:GITHUB_WORKSPACE\vcpkg\bootstrap-vcpkg.bat"

      - name: Install dependencies (vcpkg)
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\vcpkg\vcpkg.exe" install grpc:x64-windows protobuf:x64-windows

      - name: Configure CMake
        shell: pwsh
        run: |
          if (Test-Path $env:BUILD_DIR) { Remove-Item -Recurse -Force $env:BUILD_DIR }
          cmake -S . -B $env:BUILD_DIR -G "Visual Studio 17 2022" `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}\vcpkg\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        run: cmake --build $env:BUILD_DIR --config Release

      - name: Package binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/windows/bin -Force | Out-Null
          New-Item -ItemType Directory -Path dist/windows/lib -Force | Out-Null

          # Find and copy server executable
          $serverExe = Get-ChildItem -Path "$env:BUILD_DIR" -Recurse -Filter server.exe | Select-Object -First 1
          if (-not $serverExe) { throw "server.exe not found" }
          Copy-Item $serverExe.FullName dist/windows/bin/

          # Find and copy client executable
          $clientExe = Get-ChildItem -Path "$env:BUILD_DIR" -Recurse -Filter client.exe | Select-Object -First 1
          if (-not $clientExe) { throw "client.exe not found" }
          Copy-Item $clientExe.FullName dist/windows/bin/

          # Find and copy engine static library
          $engineLib = Get-ChildItem -Path "$env:BUILD_DIR" -Recurse -Filter card_engine.lib | Select-Object -First 1
          if (-not $engineLib) { throw "card_engine.lib not found" }
          Copy-Item $engineLib.FullName dist/windows/lib/

          Compress-Archive -Path dist/windows/* -DestinationPath dist/windows-binaries.zip -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries-zip
          path: dist/windows-binaries.zip

  build-macos:
    runs-on: macos-latest
    env:
      BUILD_DIR: build-macos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Homebrew)
        run: |
          brew update
          brew install cmake protobuf grpc

      - name: Configure CMake
        run: |
          rm -rf "$BUILD_DIR"
          cmake -S . -B "$BUILD_DIR"

      - name: Build
        run: cmake --build "$BUILD_DIR"

      - name: Package binaries
        run: |
          mkdir -p dist/macos/bin
          mkdir -p dist/macos/lib

          # Find and copy server executable
          SERVER_PATH=$(find "$BUILD_DIR" -name "server" -type f -perm +111 | head -n 1)
          if [ -z "$SERVER_PATH" ]; then
            echo "server executable not found"
            exit 1
          fi
          cp "$SERVER_PATH" dist/macos/bin/

          # Find and copy client executable
          CLIENT_PATH=$(find "$BUILD_DIR" -name "client" -type f -perm +111 | head -n 1)
          if [ -z "$CLIENT_PATH" ]; then
            echo "client executable not found"
            exit 1
          fi
          cp "$CLIENT_PATH" dist/macos/bin/

          # Find and copy engine static library
          ENGINE_LIB_PATH=$(find "$BUILD_DIR" -name "libcard_engine.a" | head -n 1)
          if [ -z "$ENGINE_LIB_PATH" ]; then
            echo "libcard_engine.a not found"
            exit 1
          fi
          cp "$ENGINE_LIB_PATH" dist/macos/lib/

          ditto -c -k --sequesterRsrc --keepParent dist/macos dist/macos-binaries.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-binaries-zip
          path: dist/macos-binaries.zip
