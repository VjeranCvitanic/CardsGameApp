name: Cross-Platform Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows
      BUILD_DIR: build-windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:GITHUB_WORKSPACE\vcpkg"
          & "$env:GITHUB_WORKSPACE\vcpkg\bootstrap-vcpkg.bat"

      - name: Install dependencies (vcpkg)
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\vcpkg\vcpkg.exe" install grpc protobuf --triplet $env:VCPKG_DEFAULT_TRIPLET

      - name: Configure CMake
        shell: pwsh
        run: |
          if (Test-Path $env:BUILD_DIR) { Remove-Item -Recurse -Force $env:BUILD_DIR }
          cmake -S . -B $env:BUILD_DIR -G "Visual Studio 17 2022" `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}\vcpkg\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=$env:VCPKG_DEFAULT_TRIPLET

      - name: Build
        run: cmake --build $env:BUILD_DIR --config Release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-executables
          path: |
            ${{ env.BUILD_DIR }}/**/Release/server.exe
            ${{ env.BUILD_DIR }}/**/Release/client.exe
            ${{ env.BUILD_DIR }}/**/Release/briscola.exe
            ${{ env.BUILD_DIR }}/**/Release/tressette.exe

  build-macos:
    runs-on: macos-latest
    env:
      BUILD_DIR: build-macos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Homebrew)
        run: |
          brew update
          brew install cmake protobuf grpc

      - name: Configure CMake
        run: |
          rm -rf "$BUILD_DIR"
          cmake -S . -B "$BUILD_DIR"

      - name: Build
        run: cmake --build "$BUILD_DIR"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-binaries
          path: |
            ${{ env.BUILD_DIR }}/gRPC/server
            ${{ env.BUILD_DIR }}/gRPC/client
            ${{ env.BUILD_DIR }}/CardsGameEngine/briscola
            ${{ env.BUILD_DIR }}/CardsGameEngine/tressette
